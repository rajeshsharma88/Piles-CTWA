server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve extensionless image files like Blend-Of_1024x455(2) as image/jpeg
    location ~* ^/images/Blend-Of_1024x455 {
        default_type image/jpeg;
    }

    location ~* \.(jpe?g|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
}
