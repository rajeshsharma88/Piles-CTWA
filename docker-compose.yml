services:
  piles2:
    build: .
    image: piles2:latest
    container_name: piles2
    restart: unless-stopped
    ports:
      - "8082:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.piles2-site.entrypoints=websecure"
      - "traefik.http.routers.piles2-site.rule=Host(`piles2.aarogya.cloud`)"
      - "traefik.http.routers.piles2-site.tls.certresolver=letsencrypt"
      - "traefik.http.services.piles2.loadbalancer.server.port=80"
